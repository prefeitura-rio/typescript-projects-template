# Supply-chain hardening (needs pnpm >= 10.21, pinned in package.json).
# Only resolve versions published at least 7 days ago (value in minutes).
minimumReleaseAge: 10080
# Refuse a version with weaker trust evidence than an earlier release.
trustPolicy: no-downgrade
# Exact versions already in pnpm-lock.yaml that fail the trust check only
# because earlier releases of the package had provenance attestation.
trustPolicyExclude:
  - semver@6.3.1
  - undici-types@6.21.0
